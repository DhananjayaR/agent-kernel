name: Studio

# OAK Studio, Open Agent Kernel Studio (ak-studio/, issue #950): lint, type-check, boundary checks, unit tests, Storybook
# accessibility run, end-to-end tests, and an unsigned installer whose app is started before upload, on Linux,
# Windows and macOS.
# P1a: written and parsed, not yet run (Windows, macOS and CI were deferred; see ak-studio/README.md).
on:
  pull_request:
    paths:
      - 'ak-studio/**'
      - '.github/workflows/studio.yml'
      # The app's copy of the OAK mark must stay equal to the brand file (packages/ui/src/assets/oak-mark.test.ts).
      - 'branding/logo-mark/**'
  push:
    branches:
      - develop
    paths:
      - 'ak-studio/**'
      - '.github/workflows/studio.yml'
      # The app's copy of the OAK mark must stay equal to the brand file (packages/ui/src/assets/oak-mark.test.ts).
      - 'branding/logo-mark/**'
  workflow_dispatch:

concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege GITHUB_TOKEN: checkout only. Uploading a workflow artifact needs no token scope.
permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: ak-studio
    env:
      # Unsigned builds: never look for a signing identity in the keychain or certificate store.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # The token is not left in .git/config while dependency install scripts and tests run.
          persist-credentials: false

      - name: Set up pnpm (version from ak-studio/package.json packageManager)
        # Third-party action: pinned to a commit.
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ak-studio/package.json

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: ak-studio/package.json
          cache: pnpm
          cache-dependency-path: ak-studio/pnpm-lock.yaml

      # Also downloads the Electron binary (apps/desktop postinstall: install-electron).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright's Chromium (Storybook accessibility run and browser e2e)
        run: pnpm exec playwright install --with-deps chromium

      # Biome (warnings fail), check-palette, the boundary rules (depcruise) and their self-test (the check must
      # be able to fail).
      - name: Lint (Biome, check-palette, boundary rules and self-test)
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Storybook accessibility run (dark and light)
        run: pnpm test:storybook

      # P0 found Ubuntu runners may block the unprivileged user namespaces Electron's sandbox uses. Not yet
      # verified on a runner: remove this step if the e2e tests pass without it.
      - name: Allow Electron's user-namespace sandbox (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "kernel.apparmor_restrict_unprivileged_userns not present: nothing to change"
          fi

      # Builds the app with its test hooks (the e2e build), then runs Playwright's browser and Electron projects
      # (under xvfb-run -a on Linux).
      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results-${{ matrix.os }}
          path: ak-studio/test-results/
          if-no-files-found: ignore
          retention-days: 7

      # Unsigned: AppImage on Linux, NSIS installer on Windows, dmg on macOS. Rebuilds without the test hooks.
      - name: Package
        run: pnpm package

      # Starts the packaged app (Linux: linux-unpacked/ and the AppImage; Windows: win-unpacked/; macOS: the .app),
      # waits until its window is shown and the bridge has answered, closes it, and checks that it refuses the
      # remote-debugging switches and ships no test-hook code. The installer is uploaded only if this passes.
      - name: Packaged app starts (smoke check)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a pnpm test:packaged
          else
            pnpm test:packaged
          fi

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: ak-studio-installer-${{ matrix.os }}
          path: |
            ak-studio/apps/desktop/release/*.AppImage
            ak-studio/apps/desktop/release/*.exe
            ak-studio/apps/desktop/release/*.dmg
          if-no-files-found: error
          retention-days: 14

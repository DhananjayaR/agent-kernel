# electron-builder 26.18.0: packages the electron-vite build in out/. `pnpm package` (from ak-studio/) builds
# first, then runs this for the current operating system. Unsigned everywhere in P1a.
#
# productName is the display name, "OAK Studio" (Open Agent Kernel Studio, the description in package.json); it
# also names the app's data folder. The appId (reverse DNS of the project domain kernel.yaala.ai) is unchanged.
# P12 confirms both (docs/specs/950-agent-kernel-studio/README.md, open question 3).
appId: ai.yaala.kernel.studio
productName: OAK Studio
directories:
  output: release
  # build/icon.png (1024 x 1024, made by `pnpm make-app-icon` from branding/logo-mark/oak-mark-orange.svg): the
  # icon for every platform. electron-builder makes the Linux sizes, the macOS .icns and the Windows .ico from it.
  buildResources: build
# Only the build output and the manifest. Main, preload and the renderer are bundled (the workspace contract and
# zod included), so the app ships no node_modules.
files:
  - out/**
  - package.json
# The bundled fonts' copyright lines and SIL OFL 1.1 text, next to the app (resources/ on Linux and Windows,
# Contents/Resources/ on macOS).
extraResources:
  - from: resources/THIRD-PARTY-NOTICES.txt
    to: THIRD-PARTY-NOTICES.txt
  # The window icon on Linux (main reads it from process.resourcesPath, outside app.asar).
  - from: build/icon.png
    to: icon.png
# No native modules: nothing to rebuild.
npmRebuild: false
artifactName: ak-studio-${version}-${os}-${arch}.${ext}

# Fuses are flipped in the Electron binary before signing, so ELECTRON_RUN_AS_NODE, NODE_OPTIONS and --inspect
# cannot turn the packaged app into a general Node runtime or attach a debugger to it.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true
  # Validates app.asar against the hash embedded at build time. Electron implements it on macOS and Windows
  # only; on Linux the fuse is set but has no effect.
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # The app is served from app://, never file://.
  grantFileProtocolExtraPrivileges: false
  # Unsigned macOS builds (mac.identity: null): flipping fuses invalidates Electron's ad hoc signature, which
  # Apple silicon refuses to run; this re-applies it. Not yet verified on a Mac (deferred in P1a).
  resetAdHocDarwinSignature: true

linux:
  target:
    - AppImage
  executableName: ak-studio
  category: Development
win:
  # Configured, not built in P1a (Windows is deferred).
  target:
    - nsis
mac:
  # Configured, not built in P1a (macOS is deferred). identity: null skips code signing.
  target:
    - dmg
  identity: null
